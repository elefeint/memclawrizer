<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- mem: is the custom protocol streaming media BLOBs from DuckDB; data:
         is what the mock api uses for images. ws: is required by Vite HMR in
         dev. Settled in Phase 0 so integration day has no CSP mysteries. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' mem: data:; media-src 'self' mem: data:; connect-src 'self' ws:; font-src 'self' data:"
    />
    <title>memclawrizer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/renderer/renderer.ts"></script>
  </body>
</html>
