<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Asset C: the pebble (docs/graphics-requirements.md §4).
    A matte absence, deliberately duller than any emoji prize: desaturated
    mid-grays, faint top-light, var(- -jar-line) outline so it reads on both
    themes at 17-26px. No states; sinking/dropping is code-side.
  -->
  <defs>
    <radialGradient id="pebbleBody" cx="0.38" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#a9a7a3"/>
      <stop offset="0.55" stop-color="#8d8b89"/>
      <stop offset="1" stop-color="#6f6e70"/>
    </radialGradient>
  </defs>
  <g id="pebble">
    <path d="M12 3.2 C17.4 2.9 21.3 6.6 21 11.4 C20.8 16.6 17 20.8 11.6 20.7 C6.6 20.6 3 17.2 3.1 12.3 C3.2 7.2 7 3.5 12 3.2 Z"
          fill="url(#pebbleBody)" style="stroke:var(--jar-line)" stroke-opacity="0.55" stroke-width="1"/>
    <!-- faint top-light so it feels physical, not flat -->
    <path d="M7.2 7.4 C9 5.6 12.6 4.9 15.4 5.8" fill="none" stroke="#fff" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round"/>
    <!-- ground contact -->
    <path d="M7.5 18.6 C10.5 19.9 14.5 19.8 17 18.2" fill="none" stroke="#000" stroke-opacity="0.16" stroke-width="1.4" stroke-linecap="round"/>
    <!-- one dull speck, so it reads "stone" not "button" -->
    <circle cx="15.2" cy="12.6" r="0.9" fill="#000" opacity="0.10"/>
    <circle cx="9.4" cy="13.8" r="0.7" fill="#000" opacity="0.08"/>
  </g>
</svg>
