<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104">
  <!--
    Asset E: trophy-shelf mini jar + shelf (docs/graphics-requirements.md §6),
    extended with the DENOMINATION vessel for place-value consolidation
    (DESIGN.md "The trophy shelf at scale"): #denom-back / #denom-contents
    (ten baked miniature jar silhouettes — promotion, never confiscation) /
    #denom-front, plus #numeral-10 / #numeral-100 embossed on the glass as
    pure drawn geometry (stroked paths and ellipse rings, no fonts).
    Denomination vessel is legible at ~72-96px; singles at ~40-56px.
    #shelf is a separate horizontally-stretchable wood strip.
  -->
  <defs>
    <!-- one miniature jar silhouette, stamped ten times inside the vessel -->
    <g id="tinyJar">
      <rect x="0" y="3.2" width="12" height="13" rx="3" style="fill:var(--glass)"/>
      <rect x="0" y="3.2" width="12" height="13" rx="3" fill="#fff" fill-opacity="0.10"/>
      <rect x="0" y="3.2" width="12" height="13" rx="3" fill="none" style="stroke:var(--jar-line)" stroke-opacity="0.85" stroke-width="1.1"/>
      <rect x="1.6" y="0" width="8.8" height="3.6" rx="1.6" style="fill:var(--rail)"/>
    </g>
    <linearGradient id="miniLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.4" style="stop-color:var(--steel)"/>
      <stop offset="1" style="stop-color:var(--rail)"/>
    </linearGradient>
    <linearGradient id="miniGlassV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="miniSpec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelfWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.25" style="stop-color:var(--cabinet-edge)"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <!-- glass body behind the prize glyphs -->
  <g id="mini-back" data-viewbox="0 0 56 64">
    <path d="M6 10 h44 v42 q0 9 -9 9 h-26 q-9 0 -9 -9 Z" style="fill:var(--glass)"/>
    <path d="M6 10 h44 v42 q0 9 -9 9 h-26 q-9 0 -9 -9 Z" fill="url(#miniGlassV)"/>
    <path d="M6 10 h44 v42 q0 9 -9 9 h-26 q-9 0 -9 -9 Z" fill="none" style="stroke:var(--jar-line)" stroke-opacity="0.7" stroke-width="1.6"/>
    <ellipse cx="28" cy="57" rx="18" ry="2.4" fill="#000" opacity="0.10"/>
  </g>

  <!-- glass front + lid, over the prize glyphs -->
  <g id="mini-front" data-viewbox="0 0 56 64">
    <rect x="10" y="13" width="7" height="42" rx="3.5" fill="url(#miniSpec)"/>
    <rect x="9" y="3" width="38" height="9" rx="4" fill="url(#miniLid)" style="stroke:var(--rail)" stroke-width="1"/>
    <rect x="11" y="10.5" width="34" height="2.2" rx="1.1" style="fill:var(--rail)"/>
  </g>

  <!-- ==== denomination vessel (ten-jar / hundred-jar), space 0 0 96 104 ==== -->

  <!-- vessel glass behind the contents -->
  <g id="denom-back" data-viewbox="0 0 96 104">
    <path d="M8 18 h80 v66 q0 13 -13 13 h-54 q-13 0 -13 -13 Z" style="fill:var(--glass)"/>
    <path d="M8 18 h80 v66 q0 13 -13 13 h-54 q-13 0 -13 -13 Z" fill="url(#miniGlassV)"/>
    <path d="M8 18 h80 v66 q0 13 -13 13 h-54 q-13 0 -13 -13 Z" fill="none" style="stroke:var(--jar-line)" stroke-opacity="0.8" stroke-width="2"/>
    <ellipse cx="48" cy="92" rx="34" ry="3.4" fill="#000" opacity="0.09"/>
  </g>

  <!-- the ten sealed jars, promoted intact and still visible inside -->
  <g id="denom-contents" data-viewbox="0 0 96 104">
    <use href="#tinyJar" x="13" y="30"/>
    <use href="#tinyJar" x="28" y="32"/>
    <use href="#tinyJar" x="43" y="30"/>
    <use href="#tinyJar" x="58" y="32"/>
    <use href="#tinyJar" x="73" y="30"/>
    <use href="#tinyJar" x="13" y="56"/>
    <use href="#tinyJar" x="28" y="58"/>
    <use href="#tinyJar" x="43" y="56"/>
    <use href="#tinyJar" x="58" y="58"/>
    <use href="#tinyJar" x="73" y="56"/>
  </g>

  <!-- vessel glass front + wide knurled lid -->
  <g id="denom-front" data-viewbox="0 0 96 104">
    <rect x="14" y="24" width="10" height="66" rx="5" fill="url(#miniSpec)"/>
    <rect x="12" y="6" width="72" height="13" rx="6" fill="url(#miniLid)" style="stroke:var(--rail)" stroke-width="1.2"/>
    <path d="M18 7.6v9.8 M26 7v11 M34 7v11 M42 7v11 M50 7v11 M58 7v11 M66 7v11 M74 7v11" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="1.4"/>
    <rect x="15" y="17.5" width="66" height="2.6" rx="1.3" style="fill:var(--rail)"/>
  </g>

  <!-- embossed numerals: drawn geometry only, no fonts. Emboss = the same
       strokes twice, light pass offset +1y under a dark pass. -->
  <g id="numeral-10" data-viewbox="0 0 96 104">
    <g fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" transform="translate(0 1)">
      <path d="M36 72 l6 -4 v18"/>
      <ellipse cx="55" cy="77" rx="6.5" ry="9.5"/>
    </g>
    <g fill="none" stroke="#000" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round">
      <path d="M36 72 l6 -4 v18"/>
      <ellipse cx="55" cy="77" rx="6.5" ry="9.5"/>
    </g>
  </g>

  <g id="numeral-100" data-viewbox="0 0 96 104">
    <g fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="2.8" stroke-linecap="round" transform="translate(0 1)">
      <path d="M28 72 l5.5 -4 v18"/>
      <ellipse cx="46" cy="77" rx="6" ry="9.5"/>
      <ellipse cx="62.5" cy="77" rx="6" ry="9.5"/>
    </g>
    <g fill="none" stroke="#000" stroke-opacity="0.34" stroke-width="2.8" stroke-linecap="round">
      <path d="M28 72 l5.5 -4 v18"/>
      <ellipse cx="46" cy="77" rx="6" ry="9.5"/>
      <ellipse cx="62.5" cy="77" rx="6" ry="9.5"/>
    </g>
  </g>

  <!-- wood strip; stretches horizontally under the row of minis -->
  <g id="shelf" data-viewbox="0 0 120 12">
    <rect x="0" y="0" width="120" height="12" rx="2" fill="url(#shelfWood)"/>
    <path d="M4 4.2 Q34 3 62 4.4 T118 4.0" fill="none" stroke="#000" stroke-opacity="0.10" stroke-width="0.9"/>
    <path d="M2 8.3 Q40 9.4 74 8.1 T119 8.6" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="0.9"/>
    <rect x="0" y="0" width="120" height="1.4" fill="#fff" opacity="0.18"/>
  </g>
</svg>
