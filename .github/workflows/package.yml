name: package

# Cross-platform installers. Each OS must build natively: npm ci selects the
# platform's @duckdb/node-bindings-* package, and the packageAfterCopy hook in
# forge.config.ts ships whatever @duckdb scope the runner installed.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed to create releases and upload their assets.
permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64 # deb + rpm
          - os: windows-latest
            name: windows-x64 # Squirrel installer
          - os: macos-latest
            name: macos-arm64 # zip with the .app (unsigned)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb

      - run: npm ci

      # Unit + DB tests on every OS: this is also the cross-platform proof for
      # the DuckDB native addon and the generator goldens.
      - run: npm test

      - run: npm run make

      # The Playwright smoke test drives the freshly packaged binary; it is
      # Linux-path-specific and needs a display, hence xvfb and Linux-only.
      - name: Smoke test packaged app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      # Tagged builds publish installers as RELEASE ASSETS: permanent,
      # per-version download pages, and — unlike workflow artifacts — they do
      # not count against the Actions storage quota (which we exhausted on
      # 2026-07-12 by storing ~350MB × 9 tags × 30 days of artifacts).
      - name: Publish installers to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "memclawrizer $GITHUB_REF_NAME" --notes "Installers built by CI. macOS app is unsigned: right-click → Open on first launch." || true
          find out/make -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.nupkg' -o -name '*.zip' \) -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      # Manual runs keep a short-lived artifact instead (nothing permanent to
      # attach them to). 3 days is plenty to download a test build.
      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: memclawrizer-${{ matrix.name }}
          path: out/make/**
          if-no-files-found: error
          retention-days: 3
